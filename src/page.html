<meta charset="utf-8">
<title>Em bé quê</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
  /* Layout: one screen, one column. Picture on top, the sentence under it, four big buttons at the bottom. */
  /* Colours come from Đông Hồ prints: dó paper, soot ink, vermilion, leaf green. One look, no dark theme. */
  :root {
    color-scheme: light;
    --paper: #f5eedc;
    --paper-deep: #eadfc4;
    --ink: #221c18;
    --muted: #6d6152;
    --line: #c9ba98;
    --red: #c0392b;
    --green: #2f6b4f;
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }
  .page {
    height: 100%;
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--red); }
  header p { margin: 0; font-size: 0.95rem; color: var(--muted); }

  .steps { display: flex; justify-content: center; gap: 6px; }
  .steps button {
    flex: 1 1 0; min-width: 0; max-width: 76px; aspect-ratio: 4 / 3;
    padding: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper-deep); cursor: pointer;
  }
  .steps img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .steps button[aria-current="true"] { border-color: var(--red); outline: 3px solid var(--red); }

  .middle { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; position: relative; }
  .view { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .stage {
    flex: 1; min-height: 0;
    border: 1px solid var(--ink); border-radius: 8px;
    background: var(--paper-deep);
    overflow: hidden;
  }
  .stage img { width: 100%; height: 100%; max-width: 100%; object-fit: contain; display: block; }
  .credit { margin: 0; font-size: 0.75rem; color: var(--muted); }

  /* Word panel: a column at the right on a wide screen, over the picture on a phone. */
  .panel {
    min-height: 0; min-width: 0; overflow: auto;
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--ink); border-radius: 8px;
    background: var(--paper); padding: 12px;
  }
  .panel h2 { margin: 0; font-size: 2rem; font-weight: 700; color: var(--red); }
  .panel .meaning { margin: 0; font-size: 1.4rem; color: var(--green); }
  .panel img { width: 100%; max-height: 50%; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-deep); flex: 1; min-height: 0; }
  .panel .close {
    align-self: flex-end; min-height: 40px; padding: 0 12px;
    border: 1px solid var(--ink); border-radius: 8px;
    background: var(--paper); color: var(--ink);
    font: 600 0.9rem var(--font); cursor: pointer;
  }
  @media (min-width: 720px) { .middle.open { grid-template-columns: minmax(0, 1fr) 280px; } }
  @media (max-width: 719px) { .panel { position: absolute; inset: 0; } }

  .vi .word {
    font: inherit; color: inherit; background: none; cursor: pointer;
    border: 0; border-bottom: 2px dotted var(--red); border-radius: 0;
    padding: 0 2px; margin: 0 3px;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .vi .word:hover { background: var(--paper-deep); }
  .vi .word.sung { background: var(--green); color: var(--paper); }
  .vi .word[aria-pressed="true"] { background: var(--red); color: var(--paper); }
  .panel .listen {
    min-height: 48px; padding: 0 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--green); border-radius: 10px;
    background: var(--green); color: var(--paper);
    font: 600 1rem var(--font); cursor: pointer;
  }
  .panel .listen svg { width: 22px; height: 22px; fill: currentColor; }

  /* Review mode (#review): tap once per sung word to correct the word starts. */
  .page.reviewing { height: auto; }
  .page.reviewing .middle { min-height: 34vh; }
  .review {
    display: flex; flex-direction: column; gap: 8px; text-align: left;
    border: 1px solid var(--ink); border-radius: 8px; padding: 12px;
  }
  .review h2 { margin: 0; font-size: 1.1rem; color: var(--red); }
  .review p { margin: 0; font-size: 0.95rem; }
  .review .tap {
    min-height: 88px; border: 1px solid var(--red); border-radius: 10px;
    background: var(--red); color: var(--paper);
    font: 700 1.6rem var(--font); cursor: pointer; touch-action: manipulation;
  }
  .review .tap:active { background: #a93226; }
  .review label { font-size: 0.9rem; color: var(--muted); }
  .review textarea {
    width: 100%; box-sizing: border-box; min-height: 10rem; resize: vertical;
    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    background: var(--paper-deep); color: var(--ink);
    font: 0.85rem ui-monospace, Menlo, monospace;
  }

  .vi { margin: 0; font-size: clamp(1.6rem, 5.2vw, 2.6rem); font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .fr { margin: 0; font-size: clamp(1.1rem, 3.4vw, 1.6rem); color: var(--green); line-height: 1.3; text-wrap: balance; }
  .words { display: flex; flex-direction: column; gap: 4px; min-height: 6.5rem; justify-content: center; }

  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .controls button {
    min-height: 64px; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 1px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink);
    font: 600 0.9rem var(--font); cursor: pointer;
    transition: background-color 150ms ease;
  }
  .controls button:hover { background: var(--paper-deep); }
  .controls .primary { background: var(--red); border-color: var(--red); color: var(--paper); }
  .controls .primary:hover { background: #a93226; }
  .controls svg { width: 26px; height: 26px; fill: currentColor; }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
</style>

<div class="page">
  <header>
    <h1>Em bé quê</h1>
    <p>L'enfant de la campagne, une chanson de Phạm Duy</p>
  </header>

  <nav class="steps" id="steps" aria-label="Phrases de la chanson"></nav>

  <div class="middle" id="middle">
    <div class="view">
      <div class="stage" id="stage"></div>
      <p class="credit" id="credit"></p>
    </div>
    <aside class="panel" id="panel" aria-live="polite" hidden>
      <button class="close" id="panel-close" type="button">Fermer</button>
      <h2 id="panel-word" lang="vi"></h2>
      <p class="meaning" id="panel-meaning" lang="fr"></p>
      <button class="listen" id="panel-listen" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        <span>Écouter le mot</span>
      </button>
      <img id="panel-image" alt="" hidden>
      <p class="credit" id="panel-credit"></p>
    </aside>
  </div>

  <div class="words">
    <p class="vi" id="vi" lang="vi"></p>
    <p class="fr" id="fr" lang="fr"></p>
  </div>

  <div class="controls">
    <button id="previous" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 7 12l8.5 8z"/></svg>
      <span>Avant</span>
    </button>
    <button id="repeat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6l5 4.5V7a5.5 5.5 0 1 1-5.5 5.5h-2A7.5 7.5 0 1 0 12 5z"/></svg>
      <span>Répéter</span>
    </button>
    <button id="play" type="button" class="primary">
      <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
      <span id="play-label">Écouter</span>
    </button>
    <button id="next" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 17 12l-8.5 8z"/></svg>
      <span>Après</span>
    </button>
  </div>

  <section class="review" id="review" aria-label="Réglage des mots" hidden>
    <h2>Réglage des mots</h2>
    <p>Appuie sur Répéter, puis touche le gros bouton (ou Espace) à chaque mot chanté.</p>
    <button class="tap" id="review-tap" type="button">Mot !</button>
    <p id="review-status" aria-live="polite"></p>
    <label for="review-output" id="review-label">À copier dans song.json</label>
    <textarea id="review-output" readonly spellcheck="false"></textarea>
  </section>
</div>

<audio id="song" preload="auto" src="__AUDIO__"></audio>

<script>
  const sentences = __SENTENCES__;
  const credits = __CREDITS__;
  const song = document.getElementById("song");
  const stage = document.getElementById("stage");
  const steps = document.getElementById("steps");
  const PLAY_PATH = "M7 4v16l13-8z";
  const PAUSE_PATH = "M6 4h4v16H6zM14 4h4v16h-4z";

  let current = 0;
  let stopAt = null; // set while one sentence or one word is repeated
  let sungIndex = -1;
  let openedWord = null;
  let recording = null; // review mode: { index, taps } while the user taps the words

  const images = sentences.map((sentence, index) => {
    const image = document.createElement("img");
    image.src = "img/" + sentence.image;
    image.alt = sentence.fr;
    image.hidden = index !== 0;
    stage.appendChild(image);
    return image;
  });

  const stepButtons = sentences.map((sentence, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.id = "step-" + (index + 1);
    const thumbnail = document.createElement("img");
    thumbnail.src = "img/" + sentence.image;
    thumbnail.alt = "";
    button.appendChild(thumbnail);
    button.setAttribute("aria-label", "Phrase " + (index + 1));
    button.addEventListener("click", () => goTo(index));
    steps.appendChild(button);
    return button;
  });

  function show(index) {
    current = index;
    sungIndex = -1;
    if (recording && recording.index !== index) recording = null;
    images.forEach((image, i) => { image.hidden = i !== index; });
    stepButtons.forEach((button, i) => button.setAttribute("aria-current", i === index ? "true" : "false"));
    closePanel();
    const line = document.getElementById("vi");
    line.replaceChildren(...sentences[index].words.map((word, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "word";
      button.id = "word-" + (i + 1);
      button.textContent = word.vi;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => openWord(word, button));
      return button;
    }));
    document.getElementById("fr").textContent = sentences[index].fr;
    document.getElementById("credit").textContent = credits[sentences[index].image];
    refreshReview();
  }

  function openWord(word, button) {
    const alreadyOpen = button.getAttribute("aria-pressed") === "true";
    closePanel();
    if (alreadyOpen) return;
    openedWord = word;
    button.setAttribute("aria-pressed", "true");
    document.getElementById("panel-listen").hidden = typeof word.start !== "number";
    document.getElementById("panel-word").textContent = word.vi;
    document.getElementById("panel-meaning").textContent = word.fr;
    const image = document.getElementById("panel-image");
    image.hidden = !word.image;
    if (word.image) { image.src = "img/" + word.image; image.alt = word.fr; }
    document.getElementById("panel-credit").textContent = word.image ? credits[word.image] : "";
    document.getElementById("panel").hidden = false;
    document.getElementById("middle").classList.add("open");
  }

  function closePanel() {
    openedWord = null;
    document.querySelectorAll(".word[aria-pressed='true']").forEach((b) => b.setAttribute("aria-pressed", "false"));
    document.getElementById("panel").hidden = true;
    document.getElementById("middle").classList.remove("open");
  }

  function sentenceAt(time) {
    let index = 0;
    sentences.forEach((sentence, i) => { if (time >= sentence.start) index = i; });
    return index;
  }

  function goTo(index) {
    const target = Math.max(0, Math.min(sentences.length - 1, index));
    stopAt = null;
    song.currentTime = sentences[target].start;
    show(target);
  }

  function repeatSentence() {
    song.currentTime = sentences[current].start;
    stopAt = sentences[current].end;
    if (reviewMode()) recording = { index: current, taps: [] };
    refreshReview();
    song.play();
  }

  function playWord() {
    if (!openedWord || typeof openedWord.start !== "number") return;
    recording = null;
    song.currentTime = openedWord.start;
    stopAt = openedWord.end;
    song.play();
  }

  // The sung word runs from its start to the next word's start: held vowels outlast the aligned end.
  function wordAt(time) {
    const sentence = sentences[current];
    if (time < sentence.start || time >= sentence.end) return -1;
    let index = -1;
    sentence.words.forEach((word, i) => { if (typeof word.start === "number" && time >= word.start) index = i; });
    return index;
  }

  function highlight(index) {
    if (index === sungIndex) return;
    sungIndex = index;
    document.querySelectorAll("#vi .word").forEach((button, i) => button.classList.toggle("sung", i === index));
  }

  function reviewMode() {
    return location.hash === "#review";
  }

  function refreshReview() {
    const on = reviewMode();
    document.getElementById("review").hidden = !on;
    document.querySelector(".page").classList.toggle("reviewing", on);
    if (!on) { recording = null; return; }
    const total = sentences[current].words.length;
    const status = document.getElementById("review-status");
    if (recording) status.textContent = "Mot " + recording.taps.length + " sur " + total;
    else status.textContent = "Phrase " + (current + 1) + " : " + total + " mots.";
  }

  function tap() {
    const status = document.getElementById("review-status");
    if (!recording || song.paused) {
      status.textContent = "Appuie d'abord sur Répéter.";
      return;
    }
    const sentence = sentences[recording.index];
    if (recording.taps.length >= sentence.words.length) return;
    const time = Math.max(sentence.start, Math.min(sentence.end, song.currentTime));
    const previous = recording.taps[recording.taps.length - 1];
    if (previous !== undefined && time - previous < 0.1) return;
    recording.taps.push(Math.round(time * 100) / 100);
    highlight(recording.taps.length - 1);
    refreshReview();
    if (recording.taps.length === sentence.words.length) applyTaps();
  }

  function applyTaps() {
    const sentence = sentences[recording.index];
    const taps = recording.taps;
    sentence.words.forEach((word, i) => {
      word.start = taps[i];
      word.end = i + 1 < taps.length ? taps[i + 1] : sentence.end;
    });
    document.getElementById("review-label").textContent =
      "Phrase " + (recording.index + 1) + " : remplace « words » dans song.json par :";
    document.getElementById("review-output").value = JSON.stringify(sentence.words, null, 2);
    const status = document.getElementById("review-status");
    status.textContent = "C'est noté ! Phrase " + (recording.index + 1) + " corrigée.";
    recording = null;
  }

  function stopRecording() {
    if (!recording) return;
    const total = sentences[recording.index].words.length;
    document.getElementById("review-status").textContent =
      recording.taps.length + " mots sur " + total + ". Recommence avec Répéter.";
    recording = null;
  }

  function togglePlay() {
    if (!song.paused) { song.pause(); return; }
    stopAt = null;
    if (song.ended || song.currentTime >= song.duration - 0.2) song.currentTime = 0;
    song.play();
  }

  function refreshPlayButton() {
    const playing = !song.paused;
    document.querySelector("#play-icon path").setAttribute("d", playing ? PAUSE_PATH : PLAY_PATH);
    document.getElementById("play-label").textContent = playing ? "Pause" : "Écouter";
  }

  function tick() {
    update();
    requestAnimationFrame(tick);
  }

  function update() {
    if (!song.paused) {
      if (stopAt !== null && song.currentTime >= stopAt) {
        song.pause();
        stopAt = null;
        stopRecording();
      } else if (stopAt === null) {
        const index = sentenceAt(song.currentTime);
        if (index !== current) show(index);
      }
      if (!recording) highlight(song.paused ? -1 : wordAt(song.currentTime));
    }
  }

  song.addEventListener("play", refreshPlayButton);
  song.addEventListener("pause", () => { refreshPlayButton(); stopRecording(); highlight(-1); });
  song.addEventListener("ended", refreshPlayButton);
  // Animation frames stop in a hidden tab; timeupdate still fires there, so stopAt holds.
  song.addEventListener("timeupdate", update);
  document.getElementById("panel-listen").addEventListener("click", playWord);
  document.getElementById("review-tap").addEventListener("pointerdown", (event) => { event.preventDefault(); tap(); });
  document.getElementById("review-output").addEventListener("focus", (event) => event.target.select());
  window.addEventListener("hashchange", refreshReview);
  document.getElementById("play").addEventListener("click", togglePlay);
  document.getElementById("repeat").addEventListener("click", repeatSentence);
  document.getElementById("previous").addEventListener("click", () => goTo(current - 1));
  document.getElementById("next").addEventListener("click", () => goTo(current + 1));
  document.getElementById("panel-close").addEventListener("click", closePanel);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePanel();
    if (event.target.closest("textarea")) return;
    if (reviewMode() && event.key === " ") {
      event.preventDefault();
      if (!event.repeat) tap();
      return;
    }
    if (event.target.closest("button")) return;
    if (event.key === " ") { event.preventDefault(); togglePlay(); }
    if (event.key === "ArrowLeft") goTo(current - 1);
    if (event.key === "ArrowRight") goTo(current + 1);
    if (event.key === "r") repeatSentence();
  });

  show(0);
  requestAnimationFrame(tick);
</script>
