<meta charset="utf-8">
<title>L'imagier des animaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
  /* All the animals of the game in one grid. Touch a picture to hear its Vietnamese word. */
  :root {
    color-scheme: light;
    --paper: #f5eedc;
    --paper-deep: #eadfc4;
    --ink: #221c18;
    --muted: #6d6152;
    --line: #c9ba98;
    --red: #c0392b;
    --green: #2f6b4f;
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 24px;
  }
  .page { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--red); }
  header nav { display: flex; gap: 16px; font-size: 0.95rem; }
  header a { color: var(--muted); }
  .hint { margin: 0; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .tile {
    min-width: 0; padding: 6px 6px 8px;
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #fff; cursor: pointer; touch-action: manipulation;
    font-family: var(--font); color: var(--ink);
    transition: border-color 150ms ease, transform 150ms ease;
  }
  .tile:hover { border-color: var(--ink); }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  .tile .vi { font-size: 1rem; font-weight: 700; line-height: 1.2; }
  .tile .fr { font-size: 0.85rem; color: var(--green); line-height: 1.2; }
  .tile.playing { border-color: var(--red); outline: 3px solid var(--red); transform: scale(1.03); }
  @media (prefers-reduced-motion: reduce) { .tile.playing { transform: none; } }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .credit { margin: 0; font-size: 0.75rem; color: var(--muted); text-align: center; }
  .credit a { color: inherit; }
</style>

<div class="page">
  <header>
    <h1>L'imagier des animaux</h1>
    <nav>
      <a href="animaux.html">Le jeu</a>
      <a href="index.html">La chanson</a>
    </nav>
  </header>
  <p class="hint">Touche une image pour entendre le mot.</p>
  <div class="grid" id="grid"></div>
  <p class="credit">Images et sons : deck Anki <a href="https://ankiweb.net/shared/info/1119829676" target="_blank" rel="noopener">Bé Học Tiếng Anh</a>.</p>
</div>

<audio id="word" preload="none"></audio>

<script>
  const animals = __ANIMALS__;
  const word = document.getElementById("word");
  let playing = null;

  function tile(animal) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tile";
    const image = document.createElement("img");
    image.src = "anki/" + animal.thumbnail;
    image.alt = "";
    image.loading = "lazy";
    const vietnamese = document.createElement("span");
    vietnamese.className = "vi";
    vietnamese.lang = "vi";
    vietnamese.textContent = animal.vi;
    const french = document.createElement("span");
    french.className = "fr";
    french.lang = "fr";
    french.textContent = animal.fr;
    button.append(image, vietnamese, french);
    button.addEventListener("click", () => play(animal, button));
    return button;
  }

  function play(animal, button) {
    playing?.classList.remove("playing");
    playing = button;
    button.classList.add("playing");
    word.src = "anki/" + animal.audio;
    word.play().catch(() => stop());
  }

  function stop() {
    playing?.classList.remove("playing");
    playing = null;
  }

  word.addEventListener("ended", stop);
  document.getElementById("grid").replaceChildren(...animals.map(tile));
</script>
