<meta charset="utf-8">
<title>Les animaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
  /* One slide per animal: two pictures, the word is spoken, the child touches the right picture. */
  /* Same Đông Hồ colours as the song page. */
  :root {
    color-scheme: light;
    --paper: #f5eedc;
    --paper-deep: #eadfc4;
    --ink: #221c18;
    --muted: #6d6152;
    --line: #c9ba98;
    --red: #c0392b;
    --green: #2f6b4f;
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }
  .page {
    height: 100%; max-width: 860px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--red); }
  header nav { display: flex; gap: 12px; }
  header a { color: var(--muted); font-size: 0.95rem; }
  .progress { margin: 0; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .slide { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .choices { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-aspect-ratio: 3/4) { .choices { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  .choice {
    min-height: 0; min-width: 0; padding: 8px; position: relative;
    display: flex; flex-direction: column; gap: 6px;
    border: 2px solid var(--ink); border-radius: 12px;
    background: #fff; cursor: pointer; touch-action: manipulation;
    transition: opacity 200ms ease, border-color 150ms ease;
  }
  .choice img { flex: 1; min-height: 0; width: 100%; object-fit: contain; display: block; }
  .choice .label { margin: 0; min-height: 1.4em; font: 600 1.1rem var(--font); color: var(--ink); }
  .choice .label span { color: var(--green); font-weight: 400; }
  .choice.right { border-color: var(--green); outline: 5px solid var(--green); }
  .choice.wrong { border-color: var(--red); opacity: 0.35; animation: shake 300ms ease; }
  .choice:disabled { cursor: default; }
  .choice .mark {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--green); color: var(--paper);
  }
  .choice .mark svg { width: 28px; height: 28px; fill: currentColor; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { .choice.wrong { animation: none; } }

  .start, .end {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .start p, .end p { margin: 0; font-size: 1.2rem; }
  .end h2 { margin: 0; font-size: 2rem; color: var(--green); }
  .big {
    min-height: 72px; padding: 0 32px;
    border: 1px solid var(--red); border-radius: 12px;
    background: var(--red); color: var(--paper);
    font: 700 1.4rem var(--font); cursor: pointer;
  }
  .big:hover { background: #a93226; }

  .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
  .controls button {
    min-height: 64px; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 1px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink);
    font: 600 0.9rem var(--font); cursor: pointer;
    transition: background-color 150ms ease;
  }
  .controls button:hover { background: var(--paper-deep); }
  .controls button:disabled { opacity: 0.35; cursor: default; }
  .controls .primary { background: var(--red); border-color: var(--red); color: var(--paper); }
  .controls .primary:hover { background: #a93226; }
  .controls .primary.next { background: var(--green); border-color: var(--green); }
  .controls svg { width: 26px; height: 26px; fill: currentColor; }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .credit { margin: 0; font-size: 0.75rem; color: var(--muted); }
  .credit a { color: inherit; }
</style>

<div class="page">
  <header>
    <h1>Les animaux</h1>
    <p class="progress" id="progress"></p>
    <nav><a href="imagier.html">L'imagier</a> <a href="index.html">La chanson</a></nav>
  </header>

  <section class="start" id="start">
    <p>Écoute le mot, puis touche la bonne image.</p>
    <button class="big" id="begin" type="button">Commencer</button>
  </section>

  <section class="slide" id="slide" hidden>
    <div class="choices" id="choices"></div>
  </section>

  <section class="end" id="end" hidden>
    <h2>Bravo !</h2>
    <p id="score"></p>
    <button class="big" id="again" type="button">Rejouer</button>
  </section>

  <div class="controls" id="controls" hidden>
    <button id="previous" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 7 12l8.5 8z"/></svg>
      <span>Avant</span>
    </button>
    <button id="listen" type="button" class="primary">
      <svg id="listen-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <span id="listen-label">Réécouter</span>
    </button>
    <button id="next" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 17 12l-8.5 8z"/></svg>
      <span>Après</span>
    </button>
  </div>

  <p class="credit">Images et sons : deck Anki <a href="https://ankiweb.net/shared/info/1119829676" target="_blank" rel="noopener">Bé Học Tiếng Anh</a>.</p>
</div>

<audio id="word" preload="auto"></audio>

<script>
  const animals = __ANIMALS__;
  const ROUND = 10;
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 12-12-1.4-1.4z"/></svg>';
  const word = document.getElementById("word");
  let slides = [];
  let current = 0;
  let sound = null; // Web Audio context for the right and wrong tones, made on the first tap

  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function newRound() {
    slides = shuffle(animals).slice(0, ROUND).map((answer) => {
      const others = animals.filter((animal) => animal.id !== answer.id);
      const decoy = others[Math.floor(Math.random() * others.length)];
      return { answer, choices: shuffle([answer, decoy]), tries: [], solved: false };
    });
    show(0);
  }

  function show(index) {
    current = index;
    const ended = index >= slides.length;
    document.getElementById("start").hidden = true;
    document.getElementById("slide").hidden = ended;
    document.getElementById("end").hidden = !ended;
    document.getElementById("controls").hidden = ended;
    document.getElementById("progress").textContent = ended ? "" : (index + 1) + " / " + slides.length;
    if (ended) { showScore(); return; }
    const slide = slides[index];
    document.getElementById("choices").replaceChildren(...slide.choices.map((animal) => card(slide, animal)));
    refreshControls();
    playWord();
  }

  function card(slide, animal) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.dataset.id = animal.id;
    const image = document.createElement("img");
    image.src = "anki/" + animal.image;
    image.alt = "";
    const label = document.createElement("p");
    label.className = "label";
    button.append(image, label);
    button.setAttribute("aria-label", "Image " + (slide.choices.indexOf(animal) + 1));
    button.addEventListener("click", () => choose(slide, animal, button));
    paint(slide, animal, button);
    return button;
  }

  function paint(slide, animal, button) {
    const isAnswer = animal.id === slide.answer.id;
    const tried = slide.tries.includes(animal.id);
    button.classList.toggle("right", slide.solved && isAnswer);
    button.classList.toggle("wrong", tried && !isAnswer);
    button.disabled = slide.solved || tried;
    const label = button.querySelector(".label");
    label.replaceChildren();
    if (slide.solved || tried) {
      const french = document.createElement("span");
      french.lang = "fr";
      french.textContent = animal.fr;
      const vietnamese = document.createElement("b");
      vietnamese.lang = "vi";
      vietnamese.textContent = animal.vi;
      label.append(vietnamese, " · ", french);
    }
    button.querySelector(".mark")?.remove();
    if (slide.solved && isAnswer) button.insertAdjacentHTML("beforeend", '<span class="mark">' + CHECK + "</span>");
  }

  function choose(slide, animal, button) {
    if (slide.solved) return;
    slide.tries.push(animal.id);
    if (animal.id === slide.answer.id) {
      slide.solved = true;
      tone([523, 659, 784]);
    } else {
      tone([220, 196]);
      setTimeout(playWord, 500);
    }
    document.querySelectorAll(".choice").forEach((other) => {
      const choice = slide.choices.find((c) => String(c.id) === other.dataset.id);
      paint(slide, choice, other);
    });
    refreshControls();
    if (slide.solved) document.getElementById("listen").focus();
  }

  function refreshControls() {
    const slide = slides[current];
    document.getElementById("previous").disabled = current === 0;
    const listen = document.getElementById("listen");
    listen.classList.toggle("next", slide.solved);
    document.getElementById("listen-label").textContent = slide.solved ? "Suivant" : "Réécouter";
    document.querySelector("#listen-icon path").setAttribute("d", slide.solved
      ? "M8.5 4 17 12l-8.5 8z"
      : "M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z");
  }

  function playWord() {
    const slide = slides[current];
    if (!slide) return;
    const source = "anki/" + slide.answer.audio;
    if (!word.src.endsWith(encodeURI(source))) word.src = source;
    word.currentTime = 0;
    word.play().catch(() => {});
  }

  function tone(frequencies) {
    if (!sound) return;
    const start = sound.currentTime;
    frequencies.forEach((frequency, i) => {
      const oscillator = sound.createOscillator();
      const gain = sound.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.value = frequency;
      const at = start + i * 0.12;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.25, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
      oscillator.connect(gain).connect(sound.destination);
      oscillator.start(at);
      oscillator.stop(at + 0.3);
    });
  }

  function showScore() {
    const firstTry = slides.filter((slide) => slide.tries.length === 1).length;
    document.getElementById("score").textContent =
      firstTry + " sur " + slides.length + " trouvés du premier coup.";
  }

  function begin() {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (Context && !sound) sound = new Context();
    newRound();
  }

  document.getElementById("begin").addEventListener("click", begin);
  document.getElementById("again").addEventListener("click", begin);
  document.getElementById("previous").addEventListener("click", () => show(Math.max(0, current - 1)));
  document.getElementById("next").addEventListener("click", () => show(current + 1));
  document.getElementById("listen").addEventListener("click", () => {
    if (slides[current].solved) show(current + 1);
    else playWord();
  });
  document.addEventListener("keydown", (event) => {
    if (document.getElementById("controls").hidden || event.target.closest("button")) return;
    if (event.key === "ArrowLeft") show(Math.max(0, current - 1));
    if (event.key === "ArrowRight") show(current + 1);
    if (event.key === " ") { event.preventDefault(); document.getElementById("listen").click(); }
  });
</script>
